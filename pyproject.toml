[project]
name = "fusion-core"
version = "0.1.0"
description = "Fusion-Core — Shared FusionMLXClient for all Fusion components. All LLM calls go through fusion-mlx HTTP API."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
include = ["fusion_core*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"