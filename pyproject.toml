[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-core"
version = "0.4.0"
description = "Fusion-Core — public technical foundation for the Fusion ecosystem (LLM client, JSON parse, config, logging, FastAPI factory)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # httpx is the only runtime dep. Upper bound <1.0 guards against a
    # major-version bump breaking AsyncClient/HTTPStatusError/MockTransport
    # usage — library-correct range (R5 audit fix).
    "httpx>=0.27.0,<1.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: real fusion-mlx engine tests (run with -m integration; starts/stops engine)",
]

[tool.coverage.run]
source = ["fusion_core"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["fusion_core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["fusion_core"]

[tool.setuptools.packages.find]
include = ["fusion_core*"]
