name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify version matches tag
        # pyproject version must equal the tag (minus leading v); guards drift.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_version="${TAG#v}"
          echo "pyproject version: $pkg_version"
          echo "tag version:        $tag_version"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: pyproject=$pkg_version tag=$tag_version"
            exit 1
          fi

      - name: Run unit tests (release gate)
        run: |
          pip install -e ".[test]"
          pytest tests/ -m "not integration" -q

      - name: Build sdist + wheel
        # R4 audit fix: ship built distributions so downstream enterprises can
        # install via wheel (correct baked-in metadata) instead of editable
        # installs whose egg-info drifts from pyproject on version bumps.
        run: |
          pip install build
          python -m build
          echo "Built artifacts:"
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
